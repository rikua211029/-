<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>JR西日本 駅名漢字タイピング</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    min-height: 100%;
}

body {
    min-height: 100vh;

    font-family:
        "Yu Gothic",
        "Meiryo",
        sans-serif;

    background:
        radial-gradient(
            circle at top,
            #173d32,
            #081b16 55%,
            #050b09
        );

    color: white;

    display: flex;
    justify-content: center;
    align-items: center;

    padding: 12px;
}


/* ==========================================
   メイン
========================================== */

.game {
    width: 100%;
    max-width: 760px;

    background:
        rgba(255,255,255,.08);

    border:
        1px solid rgba(255,255,255,.15);

    backdrop-filter: blur(15px);

    border-radius: 20px;

    padding: 20px;

    box-shadow:
        0 15px 45px rgba(0,0,0,.45);
}


/* ==========================================
   タイトル
========================================== */

.title {
    text-align: center;
}

.title h1 {
    margin: 0;

    font-size: 25px;

    color: #7dffbd;
}

.title p {
    color: #b7c9c2;

    margin: 4px 0 0;

    font-size: 13px;
}


/* ==========================================
   操作説明
========================================== */

.controls-info {
    text-align: center;

    margin-top: 10px;

    color: #a9bdb5;

    font-size: 12px;
}

.key {
    display: inline-block;

    padding: 2px 7px;

    margin: 0 2px;

    border-radius: 5px;

    background: rgba(255,255,255,.12);

    border:
        1px solid rgba(255,255,255,.15);

    color: white;

    font-weight: bold;
}


/* ==========================================
   難易度
========================================== */

.difficulty {
    display: flex;

    justify-content: center;

    gap: 7px;

    margin-top: 12px;

    flex-wrap: wrap;
}

.difficulty button {
    border: none;

    border-radius: 9px;

    padding: 7px 15px;

    font-size: 13px;

    font-weight: bold;

    cursor: pointer;

    background:
        rgba(255,255,255,.1);

    color: white;

    transition: .15s;
}

.difficulty button:hover {
    transform: translateY(-1px);
}

.difficulty button.active {
    background:
        #087f4f;

    color: white;

    box-shadow:
        0 0 12px rgba(32,201,121,.25);
}

.difficulty button:disabled {
    opacity: .45;

    cursor: default;

    transform: none;
}


/* ==========================================
   ステータス
========================================== */

.status {
    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    gap: 8px;

    margin:
        13px 0;
}

.status-box {
    background:
        rgba(0,0,0,.25);

    border-radius: 11px;

    padding: 8px;

    text-align: center;
}

.status-label {
    color: #9aada6;

    font-size: 10px;
}

.status-value {
    font-size: 19px;

    font-weight: bold;

    margin-top: 2px;
}


/* ==========================================
   ゲーム画面
========================================== */

.question {
    text-align: center;

    padding:
        22px 18px;

    background:
        rgba(0,0,0,.22);

    border-radius: 16px;
}

.question-label {
    color: #9aada6;

    font-size: 12px;
}

.station {
    font-size: 48px;

    font-weight: bold;

    letter-spacing: 6px;

    margin:
        10px 0 5px;
}

.line-name {
    color: #7dffbd;

    font-size: 12px;
}


/* ==========================================
   入力
========================================== */

.input-area {
    margin-top: 12px;
}

input {
    width: 100%;

    padding: 13px;

    border-radius: 11px;

    border:
        2px solid #315f50;

    background:
        rgba(0,0,0,.35);

    color: white;

    font-size: 20px;

    text-align: center;

    outline: none;
}

input:focus {
    border-color:
        #7dffbd;

    box-shadow:
        0 0 15px
        rgba(125,255,189,.15);
}


/* ==========================================
   メッセージ
========================================== */

.message {
    min-height: 23px;

    text-align: center;

    margin-top: 8px;

    font-size: 14px;

    font-weight: bold;
}

.correct {
    color: #63ffab;
}

.wrong {
    color: #ff7373;
}


/* ==========================================
   解説画面
========================================== */

.explanation {
    display: none;

    text-align: center;

    background:
        rgba(0,0,0,.25);

    border-radius: 16px;

    padding:
        20px;

    animation:
        explanationIn .2s ease;
}

.explanation.show {
    display: block;
}

@keyframes explanationIn {

    from {
        opacity: 0;

        transform:
            translateY(8px);
    }

    to {
        opacity: 1;

        transform:
            translateY(0);
    }
}

.result-mark {
    font-size: 34px;

    margin-bottom: 2px;
}

.explanation-title {
    font-size: 19px;

    font-weight: bold;

    color: #7dffbd;

    margin-bottom: 8px;
}

.explanation-station {
    font-size: 40px;

    font-weight: bold;

    letter-spacing: 5px;

    margin-bottom: 2px;
}

.reading {
    font-size: 21px;

    color: #7dffbd;

    font-weight: bold;

    margin-bottom: 12px;
}

.explanation-info {
    text-align: left;

    background:
        rgba(255,255,255,.06);

    border-radius: 11px;

    padding: 11px 14px;

    line-height: 1.45;
}

.info-row {
    display: flex;

    gap: 8px;

    padding: 4px 0;

    border-bottom:
        1px solid
        rgba(255,255,255,.08);
}

.info-row:last-child {
    border-bottom: none;
}

.info-label {
    min-width: 55px;

    color: #8fa69c;

    font-size: 11px;
}

.info-value {
    color: white;

    font-size: 12px;

    font-weight: bold;
}


/* ==========================================
   解説中の操作表示
========================================== */

.explanation-next {
    margin-top: 11px;

    color: #9aada6;

    font-size: 12px;
}

.explanation-next .key {
    color: white;
}


/* ==========================================
   結果画面
========================================== */

.result {
    display: none;

    text-align: center;

    padding:
        20px 10px;
}

.result.show {
    display: block;
}

.result h2 {
    color: #7dffbd;

    font-size: 27px;

    margin:
        0 0 8px;
}

.final-score {
    font-size: 45px;

    font-weight: bold;

    margin:
        5px 0 10px;
}

.result-info {
    color: #c1d1cb;

    line-height: 1.7;

    font-size: 13px;
}

.result-restart {
    margin-top: 12px;

    color: #9aada6;

    font-size: 12px;
}


/* ==========================================
   1920 × 1080向け
========================================== */

@media (min-width: 1000px) and (min-height: 800px) {

    .game {
        max-width: 760px;

        padding: 20px;
    }

}


/* ==========================================
   スマホ
========================================== */

@media(max-width:600px) {

    body {
        padding: 8px;
    }

    .game {
        padding: 14px;

        border-radius: 17px;
    }

    .title h1 {
        font-size: 21px;
    }

    .title p {
        font-size: 11px;
    }

    .station {
        font-size: 37px;

        letter-spacing: 4px;
    }

    .question {
        padding:
            18px 12px;
    }

    .status-value {
        font-size: 17px;
    }

    input {
        font-size: 17px;

        padding: 12px;
    }

    .explanation-station {
        font-size: 32px;
    }

    .reading {
        font-size: 19px;
    }

}

</style>
</head>

<div class="game">

         ゲーム画面
    ======================================= -->

    ======================================= -->

            正解！

            <div class="info-row">

                </div>

            </div>

        </div>


        <div class="explanation-next">

            <span class="key">Enter</span>

        </div>

    </div>


    <!-- ======================================
         結果画面
    ======================================= -->

    <div

    >

        <div class="result-restart">

    </div>

</div>

/* ==========================================
   ゲーム変数
========================================== */

let difficulty = "normal";

let currentStation = null;

let score = 0;

let combo = 0;

let maxCombo = 0;

let correctCount = 0;

let totalCount = 0;

let skipCount = 0;

let timeLeft = 30;

let timer = null;

let playing = false;

let showingExplanation = false;

let usedStations = [];


/* ==========================================
   難易度変更
========================================== */

function setDifficulty(level, button) {

    if (playing) return;

    difficulty = level;

    document
        .querySelectorAll(".difficulty button")
        .forEach(
            b => b.classList.remove("active")
        );

    button.classList.add("active");
}


/* ==========================================
   タイマー
========================================== */

function startTimer() {

    clearInterval(timer);

    timer = setInterval(() => {

        if (
            !playing ||
            showingExplanation
        ) {
            return;
        }

        timeLeft--;

        document.getElementById("time")
            .textContent = timeLeft;

        if (timeLeft <= 0) {

            endGame();

        }

    }, 1000);
}


/* ==========================================
   ゲーム開始
========================================== */

function startGame() {

    clearInterval(timer);

    score = 0;

    combo = 0;

    maxCombo = 0;

    correctCount = 0;

    totalCount = 0;

    skipCount = 0;

    timeLeft = 30;

    usedStations = [];

    showingExplanation = false;

    playing = true;


    document.getElementById("score")
        .textContent = "0";

    document.getElementById("combo")
        .textContent = "0";

    document.getElementById("time")
        .textContent = "30";


    document.getElementById("result")
        .classList.remove("show");

    document.getElementById("explanation")
        .classList.remove("show");


    document.getElementById("gameScreen")
        .style.display = "block";


    const input =
        document.getElementById("answer");

    input.disabled = false;

    input.value = "";

    input.focus();


    document.getElementById("message")
        .textContent = "";

    document.getElementById("message")
        .className = "message";


    nextQuestion();

    startTimer();
}


/* ==========================================
   次の問題
========================================== */

function nextQuestion() {

    let pool =
        stations.filter(
            station =>
                station.level === difficulty
        );


    if (pool.length === 0) {

        pool = [...stations];

    }


    let unusedPool =
        pool.filter(
            station =>
                !usedStations.includes(
                    station.name
                )
        );


    if (unusedPool.length === 0) {

        usedStations = [];

        unusedPool = [...pool];

    }


    currentStation =
        unusedPool[
            Math.floor(
                Math.random() *
                unusedPool.length
            )
        ];


    usedStations.push(
        currentStation.name
    );


    document.getElementById("station")
        .textContent =
        currentStation.name;

    document.getElementById("line")
        .textContent =
        currentStation.line;


    const input =
        document.getElementById("answer");

    input.value = "";

    input.focus();


    document.getElementById("message")
        .textContent = "";

    document.getElementById("message")
        .className = "message";
}


/* ==========================================
   スキップ
========================================== */

function skipQuestion() {

    if (
        !playing ||
        showingExplanation ||
        !currentStation
    ) {
        return;
    }


    const input =
        document.getElementById("answer");


    /*
        何か入力されている場合は
        Spaceを普通の入力として扱う
    */

    if (
        input.value.trim() !== ""
    ) {
        return;
    }


    skipCount++;

    combo = 0;

    document.getElementById("combo")
        .textContent = "0";


    document.getElementById("message")
        .textContent =
        "⏭️ スキップ！";

    document.getElementById("message")
        .className =
        "message";


    nextQuestion();
}


/* ==========================================
   解説表示
========================================== */

function showExplanation(correct) {

    showingExplanation = true;

    clearInterval(timer);


    const station =
        currentStation;


    document.getElementById("gameScreen")
        .style.display = "none";

    document.getElementById("explanation")
        .classList.add("show");


    document.getElementById("explanationMark")
        .textContent =
        correct ? "⭕" : "❌";

    document.getElementById("explanationTitle")
        .textContent =
        correct ? "正解！" : "不正解！";


    document.getElementById("explanationStation")
        .textContent =
        station.name;

    document.getElementById("explanationReading")
        .textContent =
        station.reading;

    document.getElementById("explanationLine")
        .textContent =
        station.line;

    document.getElementById("explanationAnswer")
        .textContent =
        station.reading;


    const levelText = {

        normal:"🟢 普通",

        hard:"🟡 難しい",

        expert:"🔴 鬼"

    };


    document.getElementById("explanationLevel")
        .textContent =
        levelText[station.level];


    document.getElementById("explanationText")
        .textContent =
        station.explanation;
}


/* ==========================================
   解説 → 次の問題
========================================== */

function nextFromExplanation() {

    document.getElementById("explanation")
        .classList.remove("show");


    showingExplanation = false;


    if (!playing) {

        return;

    }


    if (timeLeft <= 0) {

        endGame();

        return;

    }


    document.getElementById("gameScreen")
        .style.display = "block";


    nextQuestion();

    startTimer();
}


/* ==========================================
   回答判定
========================================== */

document.getElementById("answer")
    .addEventListener(
        "keydown",
        event => {

            /*
                Spaceでスキップ
            */

            if (
                event.code === "Space"
            ) {

                const input =
                    event.target;

                if (
                    input.value.trim() === ""
                ) {

                    event.preventDefault();

                    skipQuestion();

                    return;

                }

            }


            /*
                Enter
            */

            if (
                event.key !== "Enter"
            ) {
                return;
            }


            event.preventDefault();


            /*
                解説中
            */

            if (
                showingExplanation
            ) {

                nextFromExplanation();

                return;

            }


            /*
                ゲーム中
            */

            if (
                !playing ||
                !currentStation
            ) {
                return;
            }


            const input =
                event.target.value
                    .trim()
                    .replace(
                        /\s/g,
                        ""
                    );


            if (!input) {
                return;
            }


            totalCount++;


            /*
                正解
            */

            if (
                input ===
                currentStation.reading
            ) {

                correctCount++;

                combo++;


                if (
                    combo > maxCombo
                ) {

                    maxCombo = combo;

                }


                const comboBonus =
                    combo >= 5
                        ? 50
                        : combo >= 3
                            ? 20
                            : 0;


                score +=
                    100 +
                    comboBonus;


                document.getElementById("score")
                    .textContent =
                    score;

                document.getElementById("combo")
                    .textContent =
                    combo;


                document.getElementById("message")
                    .textContent =
                    combo >= 3
                        ? `⭕ 正解！ ${combo} COMBO！`
                        : "⭕ 正解！";

                document.getElementById("message")
                    .className =
                    "message correct";


                showExplanation(true);

            }


            /*
                不正解
            */

            else {

                combo = 0;


                document.getElementById("combo")
                    .textContent =
                    "0";


                document.getElementById("message")
                    .textContent =
                    "❌ ちゃうで！";

                document.getElementById("message")
                    .className =
                    "message wrong";


                showExplanation(false);

            }

        }
    );


/* ==========================================
   ページ全体のEnter操作
========================================== */

document.addEventListener(
    "keydown",
    event => {

        /*
            入力欄以外でEnter
        */

        if (
            event.key !== "Enter"
        ) {
            return;
        }


        /*
            解説中
        */

        if (
            showingExplanation
        ) {

            event.preventDefault();

            nextFromExplanation();

            return;

        }


        /*
            ゲーム開始前
        */

        if (
            !playing
        ) {

            const result =
                document.getElementById(
                    "result"
                );

            /*
                結果画面なら再スタート
            */

            if (
                result.classList.contains("show")
            ) {

                event.preventDefault();

                startGame();

                return;

            }


            /*
                初期状態ならスタート
            */

            const input =
                document.getElementById(
                    "answer"
                );

            if (
                input.disabled
            ) {

                event.preventDefault();

                startGame();

            }

        }

    }
);


/* ==========================================
   ゲーム終了
========================================== */

function endGame() {

    playing = false;

    showingExplanation = false;

    clearInterval(timer);


    document.getElementById("answer")
        .disabled = true;


    document.getElementById("gameScreen")
        .style.display = "none";

    document.getElementById("explanation")
        .classList.remove("show");

    document.getElementById("result")
        .classList.add("show");


    document.getElementById("finalScore")
        .textContent =
        score;


    const accuracy =
        totalCount === 0
            ? 0
            : Math.round(
                correctCount /
                totalCount *
                100
            );


    document.getElementById("resultInfo")
        .innerHTML = `

            ⏱️ 30秒終了！

            <br>

            正解：
            <b>${correctCount}</b>
            問

            ／

            回答：
            <b>${totalCount}</b>
            問

            <br>

            正答率：
            <b>${accuracy}%</b>

            ／

            最大コンボ：
            <b>${maxCombo}</b>

            <br>

            スキップ：
            <b>${skipCount}</b>
            回

        `;
}


/* ==========================================
   初期状態
========================================== */

document.getElementById("station")
    .textContent =
    "ENTER";

document.getElementById("line")
    .textContent =
    "Enterキーでゲーム開始";

</script>

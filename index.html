<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>JR西日本(他)駅名漢字タイピング</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: "Yu Gothic", "Meiryo", sans-serif;

    background:
        radial-gradient(
            circle at top,
            #173d32,
            #081b16 55%,
            #050b09
        );

    color: white;

    display: flex;
    justify-content: center;
    align-items: center;

    padding: 12px;
}

.game {
    width: 100%;
    max-width: 780px;

    max-height: calc(100vh - 24px);
    overflow-y: auto;

    background: rgba(255,255,255,.08);

    border: 1px solid rgba(255,255,255,.15);

    backdrop-filter: blur(15px);

    border-radius: 22px;

    padding: 20px;

    box-shadow:
        0 20px 60px rgba(0,0,0,.45);
}

/* =========================
   タイトル
========================= */

.title {
    text-align: center;
}

.title h1 {
    margin: 0;

    font-size: 27px;

    color: #7dffbd;
}

.title p {
    color: #b7c9c2;

    margin: 5px 0 0;

    font-size: 13px;
}

/* =========================
   設定
========================= */

.settings {
    display: grid;

    grid-template-columns: 1fr 1fr;

    gap: 10px;

    margin-top: 15px;
}

.setting-box {
    background: rgba(0,0,0,.22);

    border-radius: 13px;

    padding: 10px;
}

.setting-title {
    text-align: center;

    color: #9aada6;

    font-size: 11px;

    margin-bottom: 7px;
}

.difficulty,
.skip-select {
    display: flex;

    justify-content: center;

    gap: 6px;
}

.difficulty button,
.skip-select button {
    flex: 1;

    padding: 9px 5px;

    background: rgba(255,255,255,.1);

    color: white;

    font-size: 13px;
}

.difficulty button.active,
.skip-select button.active {
    background: #087f4f;
}

/* =========================
   ステータス
========================= */

.status {
    display: grid;

    grid-template-columns:
        repeat(4, 1fr);

    gap: 8px;

    margin: 13px 0;
}

.status-box {
    background: rgba(0,0,0,.25);

    border-radius: 12px;

    padding: 8px;

    text-align: center;
}

.status-label {
    color: #9aada6;

    font-size: 10px;
}

.status-value {
    font-size: 19px;

    font-weight: bold;

    margin-top: 2px;
}

/* =========================
   ゲーム画面
========================= */

.question {
    text-align: center;

    padding: 24px 18px;

    background: rgba(0,0,0,.22);

    border-radius: 17px;
}

.question-label {
    color: #9aada6;

    font-size: 12px;
}

.station {
    font-size: 48px;

    font-weight: bold;

    letter-spacing: 7px;

    margin: 9px 0 5px;
}

.line-name {
    color: #7dffbd;

    font-size: 12px;
}

.input-area {
    margin-top: 14px;
}

input {
    width: 100%;

    padding: 13px;

    border-radius: 12px;

    border: 2px solid #315f50;

    background: rgba(0,0,0,.35);

    color: white;

    font-size: 20px;

    text-align: center;

    outline: none;
}

input:focus {
    border-color: #7dffbd;

    box-shadow:
        0 0 18px
        rgba(125,255,189,.15);
}

/* =========================
   操作説明
========================= */

.controls {
    text-align: center;

    color: #9aada6;

    font-size: 11px;

    margin-top: 9px;
}

.controls b {
    color: #7dffbd;
}

.message {
    min-height: 23px;

    text-align: center;

    margin-top: 7px;

    font-size: 14px;

    font-weight: bold;
}

.correct {
    color: #63ffab;
}

.wrong {
    color: #ff7373;
}

/* =========================
   ボタン
========================= */

button {
    border: none;

    border-radius: 11px;

    padding: 11px 18px;

    font-size: 14px;

    font-weight: bold;

    cursor: pointer;

    transition: .15s;
}

button:hover {
    transform: translateY(-2px);
}

button:disabled {
    opacity: .45;

    cursor: default;

    transform: none;
}

.start-button,
.next-button {
    display: block;

    margin: 14px auto 0;

    background:
        linear-gradient(
            135deg,
            #20c979,
            #087f4f
        );

    color: white;

    min-width: 190px;
}

/* =========================
   解説
========================= */

.explanation {
    display: none;

    text-align: center;

    background: rgba(0,0,0,.25);

    border-radius: 17px;

    padding: 20px;
}

.explanation.show {
    display: block;
}

.result-mark {
    font-size: 38px;

    margin-bottom: 2px;
}

.explanation-title {
    font-size: 20px;

    font-weight: bold;

    color: #7dffbd;

    margin-bottom: 10px;
}

.explanation-station {
    font-size: 39px;

    font-weight: bold;

    letter-spacing: 5px;

    margin-bottom: 2px;
}

.reading {
    font-size: 21px;

    color: #7dffbd;

    font-weight: bold;

    margin-bottom: 12px;
}

.explanation-info {
    text-align: left;

    background: rgba(255,255,255,.06);

    border-radius: 13px;

    padding: 11px 14px;

    line-height: 1.55;
}

.info-row {
    display: flex;

    gap: 8px;

    padding: 4px 0;

    border-bottom:
        1px solid
        rgba(255,255,255,.08);
}

.info-row:last-child {
    border-bottom: none;
}

.info-label {
    min-width: 60px;

    color: #8fa69c;

    font-size: 11px;
}

.info-value {
    color: white;

    font-size: 12px;

    font-weight: bold;
}

.next-button {
    margin-top: 13px;
}

/* =========================
   結果
========================= */

.result {
    display: none;

    text-align: center;

    padding: 20px 10px;
}

.result.show {
    display: block;
}

.result h2 {
    color: #7dffbd;

    font-size: 27px;

    margin: 5px 0;
}

.final-score {
    font-size: 45px;

    font-weight: bold;

    margin: 8px 0;
}

.result-info {
    color: #c1d1cb;

    line-height: 1.8;

    font-size: 13px;
}

/* =========================
   スマホ
========================= */

@media(max-width:600px) {

    body {
        padding: 7px;
    }

    .game {
        padding: 14px;

        max-height: calc(100vh - 14px);
    }

    .title h1 {
        font-size: 21px;
    }

    .settings {
        grid-template-columns: 1fr;
    }

    .station {
        font-size: 36px;

        letter-spacing: 4px;
    }

    .status-value {
        font-size: 16px;
    }

    input {
        font-size: 17px;
    }

    .explanation-station {
        font-size: 31px;
    }
}
</style>
</head>

<body>

<div class="game">

    <!-- =========================
         タイトル
    ========================== -->

    <div class="title">

        <h1>
            JR西日本(他)駅名漢字タイピング
        </h1>

        <p>
            読めるか！？入力できるか！？
        </p>

    </div>


    <!-- =========================
         設定
    ========================== -->

    <div class="settings">

        <div class="setting-box">

            <div class="setting-title">
                難易度
            </div>

            <div class="difficulty">

                <button
                    class="active"
                    onclick="setDifficulty('normal', this)"
                >
                    🟢 普通
                </button>

                <button
                    onclick="setDifficulty('hard', this)"
                >
                    🟡 難しい
                </button>

                <button
                    onclick="setDifficulty('expert', this)"
                >
                    🔴 鬼
                </button>

            </div>

        </div>


        <div class="setting-box">

            <div class="setting-title">
                スキップ回数
            </div>

            <div class="skip-select">

                <button
                    class="active"
                    onclick="setSkipLimit(1, this)"
                >
                    1回
                </button>

                <button
                    onclick="setSkipLimit(2, this)"
                >
                    2回
                </button>

                <button
                    onclick="setSkipLimit(3, this)"
                >
                    3回
                </button>

            </div>

        </div>

    </div>


    <!-- =========================
         ステータス
    ========================== -->

    <div class="status">

        <div class="status-box">

            <div class="status-label">
                SCORE
            </div>

            <div
                class="status-value"
                id="score"
            >
                0
            </div>

        </div>


        <div class="status-box">

            <div class="status-label">
                TIME
            </div>

            <div
                class="status-value"
                id="time"
            >
                30
            </div>

        </div>


        <div class="status-box">

            <div class="status-label">
                COMBO
            </div>

            <div
                class="status-value"
                id="combo"
            >
                0
            </div>

        </div>


        <div class="status-box">

            <div class="status-label">
                SKIP
            </div>

            <div
                class="status-value"
                id="skipCount"
            >
                0/1
            </div>

        </div>

    </div>


    <!-- =========================
         ゲーム画面
    ========================== -->

    <div id="gameScreen">

        <div class="question">

            <div class="question-label">
                この駅名をひらがなで入力！
            </div>

            <div
                class="station"
                id="station"
            >
                START
            </div>

            <div 
                class="line-name" 
                id="line" 
            > 
                駅名タイピング 
            </div>

            <div class="input-area">

                <input
                    id="answer"
                    type="text"
                    placeholder="読みを入力"
                    autocomplete="off"
                    disabled
                >

            </div>

        </div>


        <div
            class="controls"
            id="controls"
        >
            Enter：決定　／　入力が空欄なら Space：スキップ
        </div>


        <div
            class="message"
            id="message"
        ></div>


        <button
            class="start-button"
            id="startButton"
            onclick="startGame()"
        >
            ▶ ゲームスタート
        </button>

    </div>


    <!-- =========================
         解説画面
    ========================== -->

    <div
        class="explanation"
        id="explanation"
    >

        <div
            class="result-mark"
            id="explanationMark"
        >
            ⭕
        </div>


        <div
            class="explanation-title"
            id="explanationTitle"
        >
            正解！
        </div>


        <div
            class="explanation-station"
            id="explanationStation"
        >
        </div>


        <div
            class="reading"
            id="explanationReading"
        >
        </div>


        <div class="explanation-info">

            <div class="info-row">

                <div class="info-label">
                    路線
                </div>

                <div
                    class="info-value"
                    id="explanationLine"
                >
                </div>

            </div>


            <div class="info-row">

                <div class="info-label">
                    正解
                </div>

                <div
                    class="info-value"
                    id="explanationAnswer"
                >
                </div>

            </div>


            <div class="info-row">

                <div class="info-label">
                    難易度
                </div>

                <div
                    class="info-value"
                    id="explanationLevel"
                >
                </div>

            </div>


            <div class="info-row">

                <div class="info-label">
                    解説
                </div>

                <div
                    class="info-value"
                    id="explanationText"
                >
                </div>

            </div>

        </div>


        <div class="controls">
            Enter：次の問題
        </div>


        <button
            class="next-button"
            onclick="nextFromExplanation()"
        >
            ▶ 次の問題
        </button>

    </div>


    <!-- =========================
         結果画面
    ========================== -->

    <div
        class="result"
        id="result"
    >

        <h2>
            🎉 TIME UP!
        </h2>


        <div
            class="final-score"
            id="finalScore"
        >
            0
        </div>


        <div
            class="result-info"
            id="resultInfo"
        >
        </div>


        <button
            class="start-button"
            onclick="startGame()"
        >
            🔄 もう一回
        </button>

    </div>

</div>

/* ==================================================
   ゲーム変数
================================================== */

let difficulty = "normal";

let skipLimit = 1;

let skipUsed = 0;

let currentStation = null;

let score = 0;

let combo = 0;

let maxCombo = 0;

let correctCount = 0;

let totalCount = 0;

let skippedCount = 0;

let timeLeft = 30;

let timer = null;

let playing = false;

let showingExplanation = false;

let usedStations = [];


/* ==================================================
   難易度変更
================================================== */

function setDifficulty(level, button) {

    if (playing) return;

    difficulty = level;

    document
        .querySelectorAll(".difficulty button")
        .forEach(b =>
            b.classList.remove("active")
        );

    button.classList.add("active");
}


/* ==================================================
   スキップ回数変更
================================================== */

function setSkipLimit(limit, button) {

    if (playing) return;

    skipLimit = limit;

    document
        .querySelectorAll(".skip-select button")
        .forEach(b =>
            b.classList.remove("active")
        );

    button.classList.add("active");

    document.getElementById(
        "skipCount"
    ).textContent =
        `0/${skipLimit}`;
}


/* ==================================================
   タイマー
================================================== */

function startTimer() {

    clearInterval(timer);

    timer = setInterval(() => {

        if (
            !playing ||
            showingExplanation
        ) {
            return;
        }

        timeLeft--;

        document.getElementById(
            "time"
        ).textContent = timeLeft;

        if (timeLeft <= 0) {

            endGame();

        }

    }, 1000);
}


/* ==================================================
   ゲーム開始
================================================== */

function startGame() {

    clearInterval(timer);

    score = 0;

    combo = 0;

    maxCombo = 0;

    correctCount = 0;

    totalCount = 0;

    skippedCount = 0;

    skipUsed = 0;

    timeLeft = 30;

    usedStations = [];

    showingExplanation = false;

    playing = true;


    document.getElementById(
        "score"
    ).textContent = "0";

    document.getElementById(
        "combo"
    ).textContent = "0";

    document.getElementById(
        "time"
    ).textContent = "30";

    document.getElementById(
        "skipCount"
    ).textContent =
        `0/${skipLimit}`;


    document.getElementById(
        "result"
    ).classList.remove("show");


    document.getElementById(
        "explanation"
    ).classList.remove("show");


    document.getElementById(
        "gameScreen"
    ).style.display = "block";


    const input =
        document.getElementById("answer");

    input.disabled = false;

    input.value = "";

    input.focus();


    document.getElementById(
        "startButton"
    ).disabled = true;


    document.getElementById(
        "message"
    ).textContent = "";


    nextQuestion();

    startTimer();
}


/* ==================================================
   次の問題
================================================== */

function nextQuestion() {

    let pool =
        stations.filter(
            station =>
                station.level === difficulty
        );


    if (pool.length === 0) {

        pool = stations;

    }


    let unusedPool =
        pool.filter(
            station =>
                !usedStations.includes(
                    station.name
                )
        );


    if (unusedPool.length === 0) {

        usedStations = [];

        unusedPool = [...pool];

    }


    currentStation =
        unusedPool[
            Math.floor(
                Math.random() *
                unusedPool.length
            )
        ];


    usedStations.push(
        currentStation.name
    );


    document.getElementById(
        "station"
    ).textContent =
        currentStation.name;


    document.getElementById(
        "line"
    ).textContent =
        currentStation.line;


    const input =
        document.getElementById("answer");

    input.value = "";

    input.focus();


    document.getElementById(
        "message"
    ).textContent = "";

    document.getElementById(
        "message"
    ).className = "message";
}


/* ==================================================
   解説
================================================== */

function showExplanation(correct, skipped = false) {

    showingExplanation = true;

    clearInterval(timer);


    const station = currentStation;


    document.getElementById(
        "gameScreen"
    ).style.display = "none";


    document.getElementById(
        "explanation"
    ).classList.add("show");


    if (skipped) {

        document.getElementById(
            "explanationMark"
        ).textContent = "⏭️";

        document.getElementById(
            "explanationTitle"
        ).textContent =
            "スキップ！";

    } else {

        document.getElementById(
            "explanationMark"
        ).textContent =
            correct ? "⭕" : "❌";

        document.getElementById(
            "explanationTitle"
        ).textContent =
            correct
                ? "正解！"
                : "不正解！";
    }


    document.getElementById(
        "explanationStation"
    ).textContent =
        station.name;


    document.getElementById(
        "explanationReading"
    ).textContent =
        station.reading;


    document.getElementById(
        "explanationLine"
    ).textContent =
        station.line;


    document.getElementById(
        "explanationAnswer"
    ).textContent =
        station.reading;


    const levelText = {

        normal: "🟢 普通",

        hard: "🟡 難しい",

        expert: "🔴 鬼"

    };


    document.getElementById(
        "explanationLevel"
    ).textContent =
        levelText[station.level];


    document.getElementById(
        "explanationText"
    ).textContent =
        station.explanation;
}


/* ==================================================
   解説 → 次の問題
================================================== */

function nextFromExplanation() {

    document.getElementById(
        "explanation"
    ).classList.remove("show");


    showingExplanation = false;


    if (!playing) {

        return;

    }


    if (timeLeft <= 0) {

        endGame();

        return;

    }


    document.getElementById(
        "gameScreen"
    ).style.display = "block";


    nextQuestion();

    startTimer();
}


/* ==================================================
   回答処理
================================================== */

function submitAnswer() {

    if (
        !playing ||
        showingExplanation ||
        !currentStation
    ) {
        return;
    }


    const input =
        document.getElementById(
            "answer"
        ).value
        .trim()
        .replace(/\s/g, "");


    if (!input) {

        return;

    }


    totalCount++;


    /* =========================
       正解
    ========================= */

    if (
        input === currentStation.reading
    ) {

        correctCount++;

        combo++;


        if (combo > maxCombo) {

            maxCombo = combo;

        }


        const comboBonus =
            combo >= 5
                ? 50
                : combo >= 3
                    ? 20
                    : 0;


        score +=
            100 +
            comboBonus;


        document.getElementById(
            "score"
        ).textContent = score;


        document.getElementById(
            "combo"
        ).textContent = combo;


        document.getElementById(
            "message"
        ).textContent =
            combo >= 3
                ? `⭕ 正解！ ${combo} COMBO！`
                : "⭕ 正解！";


        document.getElementById(
            "message"
        ).className =
            "message correct";


        showExplanation(true);

    }


    /* =========================
       不正解
    ========================= */

    else {

        combo = 0;


        document.getElementById(
            "combo"
        ).textContent = "0";


        document.getElementById(
            "message"
        ).textContent =
            "❌ ちゃうで！";


        document.getElementById(
            "message"
        ).className =
            "message wrong";


        showExplanation(false);

    }
}


/* ==================================================
   スキップ
================================================== */

function skipQuestion() {

    if (
        !playing ||
        showingExplanation ||
        !currentStation
    ) {
        return;
    }


    const input =
        document.getElementById(
            "answer"
        );


    /*
        入力中はスキップ不可
    */

    if (
        input.value.trim() !== ""
    ) {

        return;

    }


    /*
        回数上限
    */

    if (
        skipUsed >= skipLimit
    ) {

        document.getElementById(
            "message"
        ).textContent =
            "⚠️ スキップ回数を使い切ったで！";

        document.getElementById(
            "message"
        ).className =
            "message wrong";

        return;

    }


    skipUsed++;

    skippedCount++;


    combo = 0;


    document.getElementById(
        "combo"
    ).textContent = "0";


    document.getElementById(
        "skipCount"
    ).textContent =
        `${skipUsed}/${skipLimit}`;


    showExplanation(
        false,
        true
    );
}


/* ==================================================
   Enter / Space キー
================================================== */

document.addEventListener(
    "keydown",
    event => {

        /*
            Enter
        */

        if (
            event.key === "Enter"
        ) {

            /*
                ゲーム開始前
            */

            if (!playing) {

                const resultVisible =
                    document
                        .getElementById("result")
                        .classList
                        .contains("show");

                if (
                    !resultVisible &&
                    !showingExplanation
                ) {

                    startGame();

                }

                return;
            }


            /*
                解説中
            */

            if (showingExplanation) {

                nextFromExplanation();

                return;

            }


            /*
                ゲーム中
            */

            submitAnswer();

            return;
        }


        /*
            Space
        */

        if (
            event.code === "Space"
        ) {

            /*
                ゲーム中かつ
                入力欄が空の場合のみ
            */

            if (
                playing &&
                !showingExplanation
            ) {

                const input =
                    document.getElementById(
                        "answer"
                    );

                if (
                    document.activeElement === input &&
                    input.value.trim() === ""
                ) {

                    event.preventDefault();

                    skipQuestion();

                }

            }

        }

    }
);


/* ==================================================
   ゲーム終了
================================================== */

function endGame() {

    playing = false;

    showingExplanation = false;

    clearInterval(timer);


    document.getElementById(
        "answer"
    ).disabled = true;


    document.getElementById(
        "startButton"
    ).disabled = false;


    document.getElementById(
        "gameScreen"
    ).style.display = "none";


    document.getElementById(
        "explanation"
    ).classList.remove("show");


    document.getElementById(
        "result"
    ).classList.add("show");


    document.getElementById(
        "finalScore"
    ).textContent = score;


    const accuracy =
        totalCount === 0
            ? 0
            : Math.round(
                correctCount /
                totalCount *
                100
            );


    document.getElementById(
        "resultInfo"
    ).innerHTML = `

        ⏱️ 30秒終了！

        <br>

        正解：
        <b>${correctCount}</b> 問

        <br>

        回答：
        <b>${totalCount}</b> 問

        <br>

        スキップ：
        <b>${skippedCount}</b> 回

        <br>

        正答率：
        <b>${accuracy}%</b>

        <br>

        最大コンボ：
        <b>${maxCombo}</b>

        <br>

        出題した駅：
        <b>${usedStations.length}</b> 駅

    `;
}

</script>
